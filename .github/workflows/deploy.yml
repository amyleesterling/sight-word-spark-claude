name: Deploy to GitHub Pages

# Builds the game and publishes it to the gh-pages branch on every push to
# main. That branch serves both the GitHub Pages site (once Pages is pointed
# at it in repo settings) and the raw.githack.com mirror, which needs no
# settings at all. Enabling Pages through the API needs an owner-level token,
# so it is not attempted here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        # Copies the build over the existing branch WITHOUT deleting what is
        # already there. Old content-hashed assets are deliberately kept so a
        # CDN still serving a cached index.html can load the files it refers
        # to, instead of showing a blank page until its cache expires.
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf .deploy
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone -q --depth 1 --branch gh-pages "$remote" .deploy
          else
            git clone -q --depth 1 "$remote" .deploy
            git -C .deploy checkout -q --orphan gh-pages
            git -C .deploy rm -rq --cached . || true
            find .deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          cp -a dist/. .deploy/
          touch .deploy/.nojekyll
          cd .deploy
          # Identity must be set on THIS clone, not the outer checkout.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # Only "no changes" is a valid reason to skip; anything else must fail
          # the job loudly rather than silently reporting a green deploy.
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q origin gh-pages
          echo "Published $(git rev-parse --short HEAD) to gh-pages"

      - name: Verify the deploy actually landed
        run: |
          set -euo pipefail
          published=$(git -C .deploy rev-parse HEAD)
          remote_head=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" gh-pages | cut -f1)
          echo "local $published / remote $remote_head"
          test "$published" = "$remote_head"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
